<title>Jalan Trip Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jalan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E7EDEA; --ink:#13231F; --muted:#56675F; --line:#D6E0DB;
  --jade:#0F6E56; --jade-ink:#FFFFFF; --jade-soft:#DDF1E9;
  --sea:#185FA5; --sea-soft:#E3EEFA; --amber:#A65A0B; --amber-soft:#FCEEDD;
  --rose:#A3245A; --rose-soft:#FBE6EF; --violet:#534AB7; --violet-soft:#EEEDFE;
  --shadow:0 8px 30px rgba(19,35,31,.12);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1513; --surface:#15201D; --sunk:#1B2926; --ink:#E4ECE9; --muted:#9CB0A9; --line:#293A35;
    --jade:#4CC7A0; --jade-ink:#07261D; --jade-soft:#123329;
    --sea:#7AB0E6; --sea-soft:#12263A; --amber:#E8A55A; --amber-soft:#35250F;
    --rose:#EE89B4; --rose-soft:#38172A; --violet:#A9A3F0; --violet-soft:#22204A;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1513; --surface:#15201D; --sunk:#1B2926; --ink:#E4ECE9; --muted:#9CB0A9; --line:#293A35;
  --jade:#4CC7A0; --jade-ink:#07261D; --jade-soft:#123329;
  --sea:#7AB0E6; --sea-soft:#12263A; --amber:#E8A55A; --amber-soft:#35250F;
  --rose:#EE89B4; --rose-soft:#38172A; --violet:#A9A3F0; --violet-soft:#22204A;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.top .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.top .grow{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:38px;height:38px;padding:0 10px;font-weight:600;font-size:14px}
.brand{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--jade)}

/* generic */
.btn{border:none;background:var(--jade);color:var(--jade-ink);font-weight:700;border-radius:12px;padding:11px 16px;font-size:15px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{background:var(--amber-soft);color:var(--amber)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.section-h h2{font-size:16px;margin:0;font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-activity{background:var(--sea-soft);color:var(--sea)}
.t-food{background:var(--amber-soft);color:var(--amber)}
.t-transport{background:var(--sunk);color:var(--ink)}
.t-stay{background:var(--violet-soft);color:var(--violet)}
.t-photo{background:var(--rose-soft);color:var(--rose)}
.t-other{background:var(--sunk);color:var(--muted)}
.s-todo{background:var(--amber-soft);color:var(--amber)}
.s-booked{background:var(--sea-soft);color:var(--sea)}
.s-confirmed{background:var(--jade-soft);color:var(--jade)}

/* trips list */
.trip{display:block;width:100%;text-align:left;padding:0;overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:16px}
.trip .band{height:10px}
.trip .in{padding:14px 16px 16px}
.trip h3{margin:0 0 2px;font-size:18px;font-weight:800}
.trip .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.count{font-weight:700;color:var(--jade)}
.stack{display:flex;flex-direction:column;gap:10px}

/* day strip */
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;text-align:center;line-height:1.2}
.strip b{display:block;font-size:15px}
.strip span{font-size:11px;color:var(--muted)}

/* day */
.day{margin-top:18px;scroll-margin-top:70px}
.dayhead{display:flex;align-items:flex-start;gap:10px;padding:4px 0 10px}
.dayhead .d{flex:1;min-width:0}
.dayhead h2{margin:0;font-size:17px;font-weight:800;line-height:1.25}
.dayhead .k{font-size:12px;font-weight:700;color:var(--jade);letter-spacing:.06em;text-transform:uppercase}
.dayhead .m{font-size:12.5px;color:var(--muted)}
.tl{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:48px 1fr;gap:10px;position:relative}
.it .time{font-size:12.5px;font-weight:700;color:var(--muted);text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.it .body{border-left:2px solid var(--line);padding:0 0 10px 12px;position:relative;min-width:0}
.it .body::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--jade)}
.it.done .body::before{background:var(--jade)}
.it.done .title{text-decoration:line-through;color:var(--muted)}
.itcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.itcard .title{font-weight:700;font-size:15px;line-height:1.3;margin:4px 0 2px;overflow-wrap:anywhere}
.itcard .loc{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.itcard .note{font-size:13px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.itcard .cost{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts button,.acts a{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 9px;color:var(--ink);text-decoration:none}
.acts a.go{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.acts button:disabled{color:var(--muted);cursor:default}
.star{display:inline-block;font-size:13px;font-weight:700;color:var(--amber);margin-top:2px}
.star small{font-weight:500;color:var(--muted);font-size:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.maplink{display:block;text-align:center;text-decoration:none}
.mhint{display:block;min-height:1.2em;font-size:12.5px;font-weight:600;color:var(--jade);margin-top:2px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rcell{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.rcell input{padding:8px 10px}
.ratetbl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:12px;font-size:13.5px;border-top:1px solid var(--line);padding-top:10px}
.ratetbl b{text-align:right}
.sync{display:inline-block;font-size:11.5px;font-weight:600;margin-top:2px}
.sync-ok{color:var(--jade)} .sync-pending{color:var(--sea)} .sync-offline{color:var(--amber)} .sync-error{color:var(--rose)}
.presults{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.presult{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.presult .sub,.pchosen .sub{font-size:12.5px;color:var(--muted)}
.pchosen{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--jade);background:var(--jade-soft);border-radius:10px;padding:8px 10px}
.pchosen .main{flex:1;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.resv{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:0 0 10px 58px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add{margin-left:58px}
.addbtn{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:9px;font-weight:600;color:var(--jade)}

/* lists */
.li{padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .main{flex:1;min-width:0}
.li .title{font-weight:700;overflow-wrap:anywhere}
.li .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--sunk);padding:1px 6px;border-radius:5px}

/* budget */
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px}
.bar.over i{background:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

/* checklist */
.chk{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:none}
.chk input{width:20px;height:20px;accent-color:var(--jade);flex:0 0 auto}
.chk label{flex:1;overflow-wrap:anywhere}
.chk.on label{text-decoration:line-through;color:var(--muted)}
.x{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;border:none;background:none;padding:10px 2px 11px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--jade)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:none;background:var(--jade);color:var(--jade-ink);font-weight:800;border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);font-size:15px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,16,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 14px;font-weight:800}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{display:grid;grid-template-columns:1fr 92px;gap:8px}
.sheet .foot{display:flex;gap:8px;margin-top:6px}
.sheet .foot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30}
.warnbar{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
textarea.io{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px}
@media (max-width:360px){.f2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="sheetRoot"></div>

<script src="config.js"></script>
<script>
(() => {
'use strict';

/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const nf = new Intl.NumberFormat('id-ID');
const fmtN = (n) => nf.format(Math.round(n || 0));

const WDL = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const WD = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const parseD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmtD = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = parseD(s); d.setUTCDate(d.getUTCDate() + n); return fmtD(d); };
const todayStr = () => { const n = new Date(); return fmtD(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()))); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
function dayRange(start, end) {
  if (!start || !end || end < start) return start ? [start] : [];
  const out = []; let d = start;
  while (d <= end && out.length < 60) { out.push(d); d = addDays(d, 1); }
  return out;
}
const dayLabel = (s) => { const d = parseD(s); return `${WDL[d.getUTCDay()]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const shortDate = (s) => { const d = parseD(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
function rangeLabel(a, b) {
  if (!a) return '';
  const A = parseD(a), B = parseD(b || a);
  const y = B.getUTCFullYear();
  if (a === b || !b) return `${A.getUTCDate()} ${MON[A.getUTCMonth()]} ${y}`;
  if (A.getUTCMonth() === B.getUTCMonth()) return `${A.getUTCDate()}–${B.getUTCDate()} ${MON[B.getUTCMonth()]} ${y}`;
  return `${A.getUTCDate()} ${MON[A.getUTCMonth()]} – ${B.getUTCDate()} ${MON[B.getUTCMonth()]} ${y}`;
}

/* ---------- constants ---------- */
const ITEM_TYPES = [['activity', 'Aktivitas'], ['food', 'Makan'], ['transport', 'Transport'], ['stay', 'Penginapan'], ['photo', 'Spot foto'], ['other', 'Lainnya']];
const BOOK_KINDS = [['flight', 'Penerbangan'], ['stay', 'Penginapan'], ['ticket', 'Tiket/aktivitas'], ['transport', 'Transport'], ['food', 'Restoran'], ['other', 'Lainnya']];
const BOOK_STATUS = [['todo', 'Belum dipesan'], ['booked', 'Sudah dipesan'], ['confirmed', 'Terkonfirmasi']];
const EXP_CATS = [['food', 'Makan'], ['transport', 'Transport'], ['stay', 'Penginapan'], ['activity', 'Aktivitas & tiket'], ['shopping', 'Belanja'], ['other', 'Lainnya']];
const CURRENCIES = [['VND', 'Dong Vietnam (VND)', '₫'], ['THB', 'Baht Thailand (THB)', '฿'], ['SGD', 'Dolar Singapura (SGD)', 'S$'], ['MYR', 'Ringgit Malaysia (MYR)', 'RM'],
  ['JPY', 'Yen Jepang (JPY)', '¥'], ['KRW', 'Won Korea (KRW)', '₩'], ['CNY', 'Yuan Tiongkok (CNY)', 'CN¥'], ['PHP', 'Peso Filipina (PHP)', '₱'],
  ['USD', 'Dolar AS (USD)', 'US$'], ['EUR', 'Euro (EUR)', '€'], ['AUD', 'Dolar Australia (AUD)', 'A$'], ['SAR', 'Riyal Saudi (SAR)', 'SR']];
const SYMBOL = Object.fromEntries(CURRENCIES.map((c) => [c[0], c[2]]));
const COLORS = ['#0F6E56', '#185FA5', '#A65A0B', '#A3245A', '#534AB7', '#2F7D8C'];
const label = (list, v) => (list.find((x) => x[0] === v) || [v, v])[1];
const PLATFORMS = [['google', 'Google Maps'], ['klook', 'Klook'], ['tripadvisor', 'Tripadvisor'], ['kkday', 'KKday'], ['traveloka', 'Traveloka']];
const fold = (s) => String(s || '').toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '');

/* ---------- state & storage ---------- */
const KEY = 'jalan-trip.v1';
/*
 * rates:  kurs otomatis { VND: { idr: 0.692, at: <unix detik>, fetched: <ms> } } dari ExchangeRate-API (update harian).
 * manual: kurs isian sendiri { VND: 0.69 }, dipakai jika useManual[cur] true atau kurs otomatis belum pernah didapat.
 */
const blank = () => ({ v: 1, trips: [], activeTripId: null, tab: 'plan', rates: {}, manual: {}, useManual: {}, placeCity: 'phu-quoc' });
let storageOk = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = Object.assign(blank(), JSON.parse(raw));
      if (s.v === 1 && Array.isArray(s.trips)) {
        if (s.rate && !s.manual.VND) { s.manual.VND = s.rate; delete s.rate; } // data versi awal
        s.trips.forEach((t) => { t.cur = t.cur || 'VND'; });
        return s;
      }
    }
  } catch (e) { storageOk = false; }
  return blank();
}
let state = load();
function save(fromRemote) {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; }
  if (!fromRemote) state.trips.forEach((t) => { if (t.shareId) pushChanges(t); });
}
const trip = () => state.trips.find((t) => t.id === state.activeTripId) || null;
const CFG = window.JALAN_CONFIG || {};

/* ---------- sinkron antar-HP (Firebase Firestore) ----------
 * Satu dokumen per trip: trips/<kode>. Setiap aktivitas, tempat, booking, pengeluaran, dan checklist
 * disimpan sebagai field terpisah (items.<id>), jadi dua orang yang mengubah hal berbeda tidak saling menimpa.
 * state.seen menyimpan versi terakhir yang sudah sama dengan server, untuk menghitung perubahan yang perlu dikirim.
 */
const COLL = ['items', 'places', 'bookings', 'expenses', 'checklist'];
const META = ['name', 'place', 'start', 'end', 'cur', 'budgetIdr', 'notes', 'color'];
const FB_VERSION = '10.12.2';
let fb = null, fbLoading = null;
const subs = {}; // shareId -> unsubscribe
const syncState = {}; // trip.id -> 'ok' | 'pending' | 'offline' | 'error'
const syncEnabled = () => !!(CFG.firebase && CFG.firebase.projectId);
const plain = (x) => JSON.parse(JSON.stringify(x));

async function fbInit() {
  if (fb) return fb;
  if (!syncEnabled()) return null;
  if (!fbLoading) {
    fbLoading = (async () => {
      const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const app = appM.initializeApp(CFG.firebase);
      let db;
      try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
      catch (e) { db = fsM.getFirestore(app); }
      const auth = authM.getAuth(app);
      if (auth.authStateReady) await auth.authStateReady();
      if (!auth.currentUser) { try { await authM.signInAnonymously(auth); } catch (e) { /* offline: dicoba lagi saat online */ } }

  COLL.forEach((c) => {
    const s = seen[c] || {};
    Object.entries(cur[c]).forEach(([id, x]) => { if (s[id] !== JSON.stringify(x)) upd[`${c}.${id}`] = x; });
    Object.keys(s).forEach((id) => { if (!(id in cur[c])) upd[`${c}.${id}`] = fs.deleteField(); });

  if (!Object.keys(upd).length) return;

function applyRemote(t, data) {
  const meta = data.meta || {};

  COLL.forEach((c) => {
    const m = data[c] || {};

}

  subs[t.shareId] = fs.onSnapshot(fs.doc(db, 'trips', t.shareId), { includeMetadataChanges: true }, (snap) => {
    const tt = state.trips.find((x) => x.shareId === t.shareId);
    if (!tt) return;
    if (!snap.exists()) {
      if (!snap.metadata.fromCache && tt.joining) {
        state.trips = state.trips.filter((x) => x !== tt); if (state.activeTripId === tt.id) state.activeTripId = null;
        unsubscribe(tt.shareId); save(true); render(); toast('Kode trip tidak ditemukan');
      }
      return;
    }
    const data = snap.data();
    applyRemote(tt, data);
    tt.joining = false;
    markSeen(tt, toRemote(tt));
    syncState[tt.id] = snap.metadata.hasPendingWrites ? (navigator.onLine ? 'pending' : 'offline') : snap.metadata.fromCache ? 'offline' : 'ok';
    save(true); softRender();

}

/* ---------- rating & link Google Maps otomatis (Places API) ---------- */
let mapsP = null;
const placesEnabled = () => !!CFG.googleMapsKey;
function loadMaps() {
  if (!placesEnabled()) return Promise.resolve(null);
  if (!mapsP) {
    mapsP = new Promise((resolve, reject) => {
      window.__jalanMapsReady = () => resolve(window.google.maps);
      window.gm_authFailure = () => toast('API key Google Maps ditolak. Cek pengaturan key.');
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(CFG.googleMapsKey)}&v=weekly&loading=async&language=id&callback=__jalanMapsReady`;
      s.async = true; s.onerror = () => { mapsP = null; reject(new Error('Google Maps tidak termuat')); };

const placeCache = new Map();
async function searchPlaces(query) {
  const key = fold(query);
  if (placeCache.has(key)) return placeCache.get(key);
  const maps = await loadMaps();
  if (!maps) return [];
  const { Place } = await maps.importLibrary('places');
  const { places } = await Place.searchByText({
    textQuery: query, maxResultCount: 5, language: 'id',
    fields: ['id', 'displayName', 'formattedAddress', 'rating', 'userRatingCount', 'googleMapsURI'],
  });
  const out = places.map((p) => ({ pid: p.id, name: p.displayName || '', address: p.formattedAddress || '', rating: p.rating ?? null, count: p.userRatingCount ?? 0, uri: p.googleMapsURI || '', at: Date.now() }));

/* ---------- kurs ---------- */
let rateStatus = {}; // cur -> 'loading' | 'ok' | 'fail'
function rateInfo(cur) {
  if (cur === 'IDR') return { value: 1, source: 'idr' };
  const auto = state.rates[cur], man = state.manual[cur];
  if (man && (state.useManual[cur] || !auto)) return { value: man, source: 'manual' };
  if (auto) return { value: auto.idr, source: 'auto', at: auto.at };
  return { value: 0, source: 'none' };
}
const rateOf = (cur) => rateInfo(cur).value;
const idr = (amount, cur) => (cur === 'IDR' ? amount : amount * rateOf(cur));
const money = (amount, cur) => (cur === 'IDR' ? `Rp${fmtN(amount)}` : `${fmtN(amount)} ${SYMBOL[cur] || cur}`);
function moneyBoth(amount, cur) {
  if (!amount) return '';
  if (cur === 'IDR') return money(amount, 'IDR');
  const r = rateOf(cur);
  if (!r) return money(amount, cur);
  const v = idr(amount, cur);
  return `${money(amount, cur)} · ±Rp${fmtN(v >= 10000 ? Math.round(v / 1000) * 1000 : v)}`;
}
const fmtRate = (v) => (v >= 100 ? fmtN(v) : v.toLocaleString('id-ID', { maximumFractionDigits: 4 }));
function rateAge(at) {
  if (!at) return '';
  const d = new Date(at * 1000);
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
// Ambil kurs terbaru: saat aplikasi dibuka, saat kembali online, dan tiap 3 jam jika data lebih tua dari itu.
async function refreshRates(force) {
  const curs = [...new Set(state.trips.map((t) => t.cur || 'VND').concat(trip() ? [trip().cur] : []))].filter((c) => c && c !== 'IDR');
  if (!curs.length) curs.push('VND');
  let changed = false;
  await Promise.all(curs.map(async (cur) => {
    const old = state.rates[cur];
    if (!force && old && Date.now() - old.fetched < 3 * 3600 * 1000) return;
    rateStatus[cur] = 'loading';
    try {
      const res = await fetch(`https://open.er-api.com/v6/latest/${cur}`, { cache: 'no-store' });
      const j = await res.json();
      if (j.result !== 'success' || !j.rates || !j.rates.IDR) throw new Error('bad');
      state.rates[cur] = { idr: j.rates.IDR, at: j.time_last_update_unix, fetched: Date.now() };
      rateStatus[cur] = 'ok'; changed = true;
    } catch (e) { rateStatus[cur] = 'fail'; }
  }));
  if (changed) save();
  render();
}
function rateLine(cur) {
  const r = rateInfo(cur);
  const st = rateStatus[cur];
  if (r.source === 'auto') return `Kurs pasar ${rateAge(r.at)} · ExchangeRate-API${st === 'loading' ? ' · memperbarui…' : ''}`;
  if (r.source === 'manual') return state.useManual[cur] ? 'Kurs isian sendiri' : 'Kurs isian sendiri (kurs otomatis belum bisa diambil)';

/* Rating daftar Jelajahi diambil dari Google sekali, lalu disegarkan setelah 30 hari. */
const catG = (c) => (state.gcat || {})[fold(c.location)] || null;
let catQueue = false;
async function fetchCatalogRatings(city) {
  if (catQueue || !placesEnabled() || !navigator.onLine) return;
  const todo = CATALOG[city].items.filter((c) => { const g = catG(c); return !g || Date.now() - g.at > 30 * 86400000; });
  if (!todo.length) return;
  catQueue = true;
  state.gcat = state.gcat || {};
  try {
    for (const c of todo) {
      const res = await searchPlaces(withPlace(c.location, CATALOG[city].place));
      state.gcat[fold(c.location)] = res[0] || { rating: null, count: 0, uri: '', at: Date.now() };
      save(true); if (state.tab === 'places') softRender();
    }
  } catch (e) { console.warn(e); }
  catQueue = false;
}
async function fillRatings(t) {
  const list = t.places.concat(t.items).filter((x) => !x.g && x.type !== 'transport');
  if (!list.length) return;
  toast(`Mengambil rating ${list.length} tempat…`);
  let ok = 0;
  for (const x of list) {
    try {
      const q = withPlace(isUrl(x.location) || !x.location ? x.title : x.location, t.place);
      const res = await searchPlaces(q);
      if (res[0]) { x.g = res[0]; ok++; }
    } catch (e) { toast('Gagal mengambil rating. Cek API key Google.'); break; }
  }
  save(); render(); toast(`${ok} tempat mendapat rating Google`);
}

// Rapikan isi kolom angka saat diketik, dan jaga posisi kursor tetap di digit yang sama.
function formatNumInput(el, typedSep) {
  const dec = +el.dataset.num || 0;
  let raw = el.value;
  const caret = el.selectionStart == null ? raw.length : el.selectionStart;
  // Tanda "." atau "," yang baru diketik (ada tepat sebelum kursor) = tanda desimal.
  if (typedSep && caret > 0 && '.,'.includes(raw[caret - 1])) {

    try { const p = caret - (dec && !hasComma ? 0 : 1); el.setSelectionRange(p, p); } catch (e) { /* abaikan */ }
    return formatNumInput(el, false);

  const keepBefore = raw.slice(0, caret).replace(/[^\d,]/g, '').length;

function insertOrder(t, day, time, exceptId) {
  const list = sortItems(t.items.filter((x) => x.day === day && x.id !== exceptId));
  if (!list.length) return 1;
  if (time) {
    const idx = list.findIndex((x) => x.time && x.time > time);
    if (idx === 0) return list[0].order - 1;
    if (idx > 0) return (list[idx - 1].order + list[idx].order) / 2;

  return list[list.length - 1].order + 1;

function doImport() {
  let data;
  try { data = JSON.parse($('#importText').value); } catch (e) { toast('Teks cadangan tidak terbaca'); return; }
  const incoming = data && data.trip ? [data.trip] : data && Array.isArray(data.trips) ? data.trips : null;
  if (!incoming || !incoming.length || !incoming.every((t) => t && Array.isArray(t.items))) { toast('Format cadangan tidak dikenali'); return; }
  incoming.forEach((t) => {
    const nt = newTrip(Object.assign({}, t, { id: uid() }));
    delete nt.shareId; delete nt.joining; // cadangan menjadi trip lokal biasa; bagikan ulang jika perlu

  });

/* ---------- actions ---------- */
const find = (arr, id) => arr.find((x) => x.id === id);
function moveItem(t, id, dir) {
  const it = find(t.items, id); if (!it) return;
  const list = sortItems(t.items.filter((x) => x.day === it.day));
  const i = list.indexOf(it), j = i + dir;
  if (j < 0 || j >= list.length) return;
  list.forEach((x, k) => { x.order = k + 1; });
  [list[i].order, list[j].order] = [list[j].order, list[i].order];
}
const actions = {
  home() { state.activeTripId = null; save(); render(); window.scrollTo(0, 0); },
  open(d) { state.activeTripId = d.id; state.tab = 'plan'; save(); render(); window.scrollTo(0, 0); },
  tab(d) { state.tab = d.k; save(); render(); window.scrollTo(0, 0); },
  newTrip() { tripForm(null); },
  editTrip() { tripForm(trip()); },
  template() { templateForm(); },
  jump(d) { const el = document.getElementById('day-' + d.d); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); },
  addItem(d) { const t = trip(); if (!dayRange(t.start, t.end).length) return toast('Atur tanggal trip dulu'); itemForm(t, null, d.d); },
  editItem(d) { const t = trip(); itemForm(t, find(t.items, d.id)); },
  toggleDone(d) { const it = find(trip().items, d.id); if (it) { it.done = !it.done; save(); render(); } },
  moveUp(d) { moveItem(trip(), d.id, -1); save(); render(); },
  moveDown(d) { moveItem(trip(), d.id, 1); save(); render(); },
  sortDay(d) {
    const t = trip();
    const list = sortItems(t.items.filter((x) => x.day === d.d));
    list.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')).forEach((x, k) => { x.order = k + 1; });
    save(); render(); toast('Diurutkan berdasarkan jam');
  },
  reviews(d) { const t = trip(); const x = find(t[d.kind], d.id); if (x) reviewSheet(t, d.kind, x); },
  placeCity(d) { state.placeCity = d.k; save(); render(); },
  saveCatalog(d) {
    const c = CATALOG[d.city] && CATALOG[d.city].items[+d.i]; if (!c) return;
    const g = catG(c);
    trip().places.push({ id: uid(), title: c.title, type: c.type, location: c.location, note: c.note, g: g && g.pid ? g : null });
    save(); render(); toast('Tersimpan di Tempat simpanan');
  },
  fillRatings() { fillRatings(trip()); },
  setupHelp(d) { openSheetHtml(d.k === 'sync' ? 'Aktifkan berbagi trip' : 'Aktifkan rating Google', setupHelp(d.k)); },
  placeSearch() { runPlaceSearch(true); },
  placePick(d, el) {
    const box = $('#placeResults'); const g = box && box._results && box._results[+d.i]; if (!g) return;
    $('#f-gplace').value = JSON.stringify(g);
    const title = $('#f-title'); if (title && !title.value.trim()) title.value = g.name;
    $('#f-location').value = [g.name, g.address].filter(Boolean).join(', ');
    box.innerHTML = placeChosen(g);
  },
  placeClear() { $('#f-gplace').value = ''; $('#placeResults').innerHTML = ''; },
  async placeRefresh(d) {
    const t = trip(); const x = find(t[d.kind], d.id); if (!x) return;
    try {
      placeCache.clear();
      const res = await searchPlaces(x.g && x.g.name ? withPlace(x.g.name, t.place) : withPlace(isUrl(x.location) || !x.location ? x.title : x.location, t.place));
      if (res[0]) { x.g = res[0]; save(); render(); reviewSheet(t, d.kind, x); toast('Rating diperbarui'); } else toast('Tempat tidak ditemukan di Google');
    } catch (e) { toast('Gagal mengambil rating'); }
  },
  share() { const t = trip(); if (t.shareId) shareSheet(t); else enableShare(t); },
  copyShare() { copyText($('#shareText').value, $('#shareText')); },
  nativeShare() { const t = trip(); navigator.share({ title: t.name, text: `Rencana trip ${t.name}`, url: shareUrl(t) }).catch(() => {}); },
  stopShare() { const t = trip(); unsubscribe(t.shareId); delete t.shareId; delete syncState[t.id]; save(true); render(); toast('Trip ini tidak lagi disinkron di HP ini'); },
  joinOpen() { joinSheet(); },
  doJoin() { joinTrip($('#joinCode').value); },

  install() {

  schedulePlace(d) { const t = trip(); scheduleForm(t, find(t.places, d.id)); },
  addBooking() { bookingForm(trip(), null); },
  editBooking(d) { const t = trip(); bookingForm(t, find(t.bookings, d.id)); },
  cycleStatus(d) {

    save(); render(); toast(label(BOOK_STATUS, b.status));
  },
  copy(d, el) { copyText(d.text, null); },
  addExpense() { expenseForm(trip(), null); },
  editExpense(d) { const t = trip(); expenseForm(t, find(t.expenses, d.id)); },
  setBudget() { budgetForm(trip()); },
  addCheck() { checkForm(trip()); },
  toggleCheck(d) { const c = find(trip().checklist, d.id); if (c) { c.done = !c.done; save(); render(); } },
  delCheck(d) { const t = trip(); t.checklist = t.checklist.filter((x) => x.id !== d.id); save(); render(); },
  exportOpen() { exportOpen(trip()); },
  copyExport() { copyText($('#exportText').value, $('#exportText')); },
  importOpen() { importOpen(); },
  doImport() { doImport(); },
  deleteTrip() { state.trips = state.trips.filter((x) => x.id !== state.activeTripId); state.activeTripId = null; save(); render(); toast('Trip dihapus'); },
  closeSheet() { closeSheet(); },
  scrim(d, el, e) { if (e.target === el) closeSheet(); },
  sheetDelete() { if (sheetDelete) { sheetDelete(); closeSheet(); save(); render(); toast('Dihapus'); } },
};

// Tombol hapus butuh dua ketukan (dialog confirm() tidak tersedia di semua tampilan).
const armed = new WeakMap();
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (a === 'scrim') { if (e.target === el) closeSheet(); return; }
  const link = e.target.closest('a');
  if (link && el.contains(link)) return; // tautan (Maps, situs) di dalam kartu tetap terbuka
  if (el.type === 'checkbox') { actions[a] && actions[a](el.dataset, el, e); return; }
  if ('confirm' in el.dataset && !armed.get(el)) {
    e.preventDefault();
    const orig = el.textContent; el.textContent = 'Ketuk lagi untuk hapus'; armed.set(el, true);
    setTimeout(() => { if (el.isConnected) { el.textContent = orig; armed.delete(el); } }, 3000);
    return;
  }
  if (actions[a]) { e.preventDefault(); actions[a](el.dataset, el, e); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheetRoot.firstChild) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
});
let notesTimer;
document.addEventListener('input', (e) => {
  const t = trip();
  if (e.target.matches('[data-notes]') && t) { t.notes = e.target.value; clearTimeout(notesTimer); notesTimer = setTimeout(save, 400); }
  if (e.target.matches('[data-num]')) formatNumInput(e.target, e.inputType === 'insertText' && (e.data === '.' || e.data === ','));
  if (e.target.matches('[data-money]')) refreshMoneyHint(e.target);

    const v = num(e.target.value), r = rateOf(t.cur);

    if (e.target.dataset.conv === 'local') $('#cvIdr').value = fmtInput(Math.round(v * r), 0);
    else $('#cvLocal').value = fmtInput(v / r, noCents ? 0 : 2);
  }
  if (e.target.matches('[data-placeinput]') || (e.target.id === 'f-title' && $('#f-location') && !$('#f-location').value.trim())) {
    if (e.target.matches('[data-placeinput]')) { const h = $('#f-gplace'); if (h) h.value = ''; }
    clearTimeout(placeTimer); placeTimer = setTimeout(runPlaceSearch, 800);
  }
  if (e.target.matches('[data-explore]')) {
    exploreQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $('#exploreSearch'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* tipe search */ } }
  }
});
