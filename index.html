<title>Jalan Trip Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jalan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E7EDEA; --ink:#13231F; --muted:#56675F; --line:#D6E0DB;
  --jade:#0F6E56; --jade-ink:#FFFFFF; --jade-soft:#DDF1E9;
  --sea:#185FA5; --sea-soft:#E3EEFA; --amber:#A65A0B; --amber-soft:#FCEEDD;
  --rose:#A3245A; --rose-soft:#FBE6EF; --violet:#534AB7; --violet-soft:#EEEDFE;
  --shadow:0 8px 30px rgba(19,35,31,.12);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1513; --surface:#15201D; --sunk:#1B2926; --ink:#E4ECE9; --muted:#9CB0A9; --line:#293A35;
    --jade:#4CC7A0; --jade-ink:#07261D; --jade-soft:#123329;
    --sea:#7AB0E6; --sea-soft:#12263A; --amber:#E8A55A; --amber-soft:#35250F;
    --rose:#EE89B4; --rose-soft:#38172A; --violet:#A9A3F0; --violet-soft:#22204A;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1513; --surface:#15201D; --sunk:#1B2926; --ink:#E4ECE9; --muted:#9CB0A9; --line:#293A35;
  --jade:#4CC7A0; --jade-ink:#07261D; --jade-soft:#123329;
  --sea:#7AB0E6; --sea-soft:#12263A; --amber:#E8A55A; --amber-soft:#35250F;
  --rose:#EE89B4; --rose-soft:#38172A; --violet:#A9A3F0; --violet-soft:#22204A;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.top .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.top .grow{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:38px;height:38px;padding:0 10px;font-weight:600;font-size:14px}
.brand{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--jade)}

/* generic */
.btn{border:none;background:var(--jade);color:var(--jade-ink);font-weight:700;border-radius:12px;padding:11px 16px;font-size:15px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{background:var(--amber-soft);color:var(--amber)}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.section-h h2{font-size:16px;margin:0;font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-activity{background:var(--sea-soft);color:var(--sea)}
.t-food{background:var(--amber-soft);color:var(--amber)}
.t-transport{background:var(--sunk);color:var(--ink)}
.t-flight{background:var(--sea-soft);color:var(--ink)}
button.pill{border:0;cursor:pointer;font-family:inherit}
.linkbtn{border:0;background:none;padding:0;color:var(--sea);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.t-stay{background:var(--violet-soft);color:var(--violet)}
.t-photo{background:var(--rose-soft);color:var(--rose)}
.t-other{background:var(--sunk);color:var(--muted)}
.s-todo{background:var(--amber-soft);color:var(--amber)}
.s-booked{background:var(--sea-soft);color:var(--sea)}
.s-confirmed{background:var(--jade-soft);color:var(--jade)}

/* trips list */
.trip{display:block;width:100%;text-align:left;padding:0;overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:16px}
.trip .band{height:10px}
.trip .in{padding:14px 16px 16px}
.trip h3{margin:0 0 2px;font-size:18px;font-weight:800}
.trip .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.count{font-weight:700;color:var(--jade)}
.stack{display:flex;flex-direction:column;gap:10px}

/* day strip */
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;text-align:center;line-height:1.2}
.strip b{display:block;font-size:15px}
.strip span{font-size:11px;color:var(--muted)}

/* day */
.day{margin-top:18px;scroll-margin-top:70px}
.dayhead{display:flex;align-items:flex-start;gap:10px;padding:4px 0 10px}
.dayhead .d{flex:1;min-width:0}
.dayhead h2{margin:0;font-size:17px;font-weight:800;line-height:1.25}
.dayhead .k{font-size:12px;font-weight:700;color:var(--jade);letter-spacing:.06em;text-transform:uppercase}
.dayhead .m{font-size:12.5px;color:var(--muted)}
.tl{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:48px 1fr;gap:10px;position:relative}
.it .time{font-size:12.5px;font-weight:700;color:var(--muted);text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.it .body{border-left:2px solid var(--line);padding:0 0 10px 12px;position:relative;min-width:0}
.it .body::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--jade)}
.it.done .body::before{background:var(--jade)}
.it.done .title{text-decoration:line-through;color:var(--muted)}
.itcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.itcard .title{font-weight:700;font-size:15px;line-height:1.3;margin:4px 0 2px;overflow-wrap:anywhere}
.itcard .loc{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.itcard .note{font-size:13px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.itcard .cost{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts button,.acts a{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 9px;color:var(--ink);text-decoration:none}
.acts a.go{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.acts button:disabled{color:var(--muted);cursor:default}
.star{display:inline-block;font-size:13px;font-weight:700;color:var(--amber);margin-top:2px}
.star small{font-weight:500;color:var(--muted);font-size:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.maplink{display:block;text-align:center;text-decoration:none}
.stayrange{padding:8px 12px;min-height:54px}
.rangetxt{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.rangetxt>span{display:flex;flex-direction:column;font-weight:600;font-size:14.5px;line-height:1.25}
.rangetxt small{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rangetxt .arrow{color:var(--muted);font-weight:400}
.nights{flex:0 0 auto;background:var(--violet-soft);color:var(--violet);border-radius:999px;padding:3px 10px;font-size:12.5px}
.rsum{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.rsum>div{display:flex;flex-direction:column}
.rsum>div:last-child{text-align:right}
.rsum small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.rsum b{font-size:15px}
.rsum .rn{font-weight:800;color:var(--violet);font-size:14px}
.rstep{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.tripdot,.cday.trip::after{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--jade)}
.cmonth{margin-bottom:14px}
.cmhead{font-weight:800;font-size:15px;padding:8px 2px;position:sticky;top:0;background:var(--surface);z-index:1}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.cwd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cday{position:relative;height:42px;border:none;background:none;font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cday.trip::after{content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%)}
.cday.today{text-decoration:underline}
.cday.mid{background:var(--violet-soft)}
.cday.start,.cday.end{background:var(--violet);color:#fff;border-radius:10px}
.cday.start.trip::after,.cday.end.trip::after{background:#fff}
.psheet .foot .btn[disabled]{opacity:.5}
.sheet.noanim{animation:none!important}
.resv[role="button"]{cursor:pointer}
.resv-night{background:var(--violet-soft);border-color:transparent;color:var(--ink)}
.staymeta{font-size:12.5px;font-weight:600;color:var(--violet);margin-top:2px}
.it.stayout .body::before{border-color:var(--violet);border-style:dashed}
.picker{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;text-align:left;color:var(--ink)}
.picker svg{width:20px;height:20px;flex:0 0 auto;color:var(--muted)}
.pscrim{z-index:25}
.psheet{display:flex;flex-direction:column;height:88vh;max-height:88vh;overflow:hidden;padding-bottom:0}
.pchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;flex:0 0 auto}
.pchips::-webkit-scrollbar{display:none}
.pchips .chip{flex:0 0 auto}
.palpha{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;border-bottom:1px solid var(--line);flex:0 0 auto}
.palpha::-webkit-scrollbar{display:none}
.palpha button{flex:0 0 auto;min-width:30px;height:30px;border:none;background:var(--sunk);border-radius:7px;font-weight:700;font-size:13px;color:var(--ink)}
.plist{flex:1;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.pletter{position:sticky;top:0;background:var(--surface);font-size:12px;font-weight:800;color:var(--jade);padding:8px 4px 4px;letter-spacing:.06em}
.prow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:none;border-bottom:1px solid var(--line);background:none;padding:11px 4px;text-align:left;font-size:15px;color:var(--ink)}
.prow small{display:block;font-size:12px;color:var(--muted)}
.prow b{font-size:12px;color:var(--muted);font-weight:600}
.prow.on{background:var(--jade-soft)}
.prow.on b{color:var(--jade)}
.pempty{padding:24px 8px;text-align:center;color:var(--muted)}
.armed{background:var(--amber-soft)!important;color:var(--amber)!important;border-color:var(--amber)!important}
.tripcard{position:relative}
.tripcard .trip h3{padding-right:78px}
.tripdel{position:absolute;top:20px;right:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;max-width:calc(100% - 24px)}
.tripdel:hover,.tripdel:focus-visible{color:var(--amber);border-color:var(--amber)}
.toast{display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.toastbtn{border:none;background:none;color:inherit;font-weight:800;padding:2px 4px;text-decoration:underline;flex:0 0 auto}
.routecard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:4px}
.routecard .k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.routecard .rl{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.citybtn{display:inline-flex;align-items:center;gap:5px;border:none;background:var(--jade-soft);color:var(--jade);font-weight:700;font-size:13px;border-radius:999px;padding:3px 10px 3px 7px;margin:4px 0 2px}
.citybtn svg{width:14px;height:14px}
.citybtn.unset{background:var(--amber-soft);color:var(--amber)}
.strip .stripcity{display:block;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--bg)}
.strip button{position:relative}
.strip button[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.strip button[aria-pressed="true"] span{color:inherit;opacity:.85}
.stripdot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--jade)}
.strip button[aria-pressed="true"] .stripdot{background:var(--jade-ink)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 72px}
.daynav .btn{white-space:nowrap}
.daynav span{text-align:center}
.daynav .btn:disabled{visibility:hidden}
@keyframes slideL{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:none}}
.slide-l{animation:slideL .22s ease-out}
.slide-r{animation:slideR .22s ease-out}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;max-width:100%}
.seg button{border:none;background:var(--surface);padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink)}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:0 0 auto}
.chip:disabled{opacity:.5}
.recs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.recb{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;text-decoration:none;background:var(--sunk);color:var(--ink)}
.rec-tiktok{background:#111;color:#fff}
.rec-instagram{background:var(--rose-soft);color:var(--rose)}
.rec-youtube{background:#fde8e8;color:#b3261e}
.mhint{display:block;min-height:1.2em;font-size:12.5px;font-weight:600;color:var(--jade);margin-top:2px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rcell{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.rcell input{padding:8px 10px}
.ratetbl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:12px;font-size:13.5px;border-top:1px solid var(--line);padding-top:10px}
.ratetbl b{text-align:right}
.sync{display:inline-block;font-size:11.5px;font-weight:600;margin-top:2px}
.sync-ok{color:var(--jade)} .sync-pending{color:var(--sea)} .sync-offline{color:var(--amber)} .sync-error{color:var(--rose)}
.presults{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.presult{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.presult .sub,.pchosen .sub{font-size:12.5px;color:var(--muted)}
.pchosen{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--jade);background:var(--jade-soft);border-radius:10px;padding:8px 10px}
.pchosen .main{flex:1;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.resv{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:0 0 10px 58px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add{margin-left:58px}
.addbtn{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:9px;font-weight:600;color:var(--jade)}

/* lists */
.li{padding:12px 14px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .main{flex:1;min-width:0}
.li .title{font-weight:700;overflow-wrap:anywhere}
.li .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--sunk);padding:1px 6px;border-radius:5px}

/* budget */
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px}
.bar.over i{background:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

/* checklist */
.chk{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:none}
.chk input{width:20px;height:20px;accent-color:var(--jade);flex:0 0 auto}
.chk label{flex:1;overflow-wrap:anywhere}
.chk.on label{text-decoration:line-through;color:var(--muted)}
.x{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;border:none;background:none;padding:10px 2px 11px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--jade)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:none;background:var(--jade);color:var(--jade-ink);font-weight:800;border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);font-size:15px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,16,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 14px;font-weight:800}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
[hidden]{display:none!important}
.money{display:grid;grid-template-columns:1fr 92px;gap:8px}
.sheet .foot{display:flex;gap:8px;margin-top:6px}
.sheet .foot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30}
.warnbar{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
textarea.io{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px}

@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

  if (cur === 'IDR') return money(amount, 'IDR');
  const r = rateOf(cur);
  if (!r) return money(amount, cur);
  const v = idr(amount, cur);
  return `${money(amount, cur)} · ±Rp${fmtN(v >= 10000 ? Math.round(v / 1000) * 1000 : v)}`;
}
const fmtRate = (v) => (v >= 100 ? fmtN(v) : v.toLocaleString('id-ID', { maximumFractionDigits: 4 }));
function rateAge(at) {
  if (!at) return '';
  const d = new Date(at * 1000);
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
/* Kurs live dari Coinbase (berubah tiap menit, tanpa key); cadangan ExchangeRate-API (harian).
   Kurs per tanggal untuk pengeluaran hari yang sudah lewat: fawazahmed0 currency-api (harian, ada arsip per tanggal). */
const LIVE_MAX_AGE = 15 * 60 * 1000;
async function fetchLive(cur) {
  try {
    const res = await fetch(`https://api.coinbase.com/v2/exchange-rates?currency=${cur}`, { cache: 'no-store' });
    const v = parseFloat((await res.json()).data.rates.IDR);
    if (v > 0) return { idr: v, at: Math.floor(Date.now() / 1000), fetched: Date.now(), src: 'Coinbase', live: true };
  } catch (e) { /* coba cadangan */ }
  const res = await fetch(`https://open.er-api.com/v6/latest/${cur}`, { cache: 'no-store' });
  const j = await res.json();
  if (j.result !== 'success' || !j.rates || !j.rates.IDR) throw new Error('bad');
  return { idr: j.rates.IDR, at: j.time_last_update_unix, fetched: Date.now(), src: 'ExchangeRate-API', live: false };
}
// Ambil kurs terbaru: saat aplikasi dibuka, saat kembali online, tiap 15 menit selama aplikasi terbuka, dan saat tombol Perbarui.
async function refreshRates(force, only) {
  const curs = only ? [only] : [...new Set(state.trips.map((t) => t.cur || 'VND').concat(trip() ? [trip().cur] : []))].filter((c) => c && c !== 'IDR');
  if (!curs.length) curs.push('VND');
  let changed = false;
  await Promise.all(curs.map(async (cur) => {
    const old = state.rates[cur];
    if (!force && old && old.live && Date.now() - old.fetched < LIVE_MAX_AGE) return;
    rateStatus[cur] = 'loading';
    try { state.rates[cur] = await fetchLive(cur); rateStatus[cur] = 'ok'; changed = true; } catch (e) { rateStatus[cur] = 'fail'; }
  }));
  if (changed) save();
  if (!only) { render(); if (trip()) fixExpenseRates(trip()); }
}
const histFail = new Set();
async function histRate(cur, date) {
  state.hist = state.hist || {};
  const k = cur + ':' + date;
  if (state.hist[k]) return state.hist[k];
  if (histFail.has(k)) return 0;
  const c = cur.toLowerCase();
  for (const url of [`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/${c}.json`, `https://${date}.currency-api.pages.dev/v1/currencies/${c}.json`]) {
    try { const j = await (await fetch(url)).json(); const v = j[c] && j[c].idr; if (v > 0) { state.hist[k] = v; return v; } } catch (e) { /* coba berikutnya */ }
  }
  histFail.add(k);
  return 0;
}
/* Setiap pengeluaran mengunci kursnya sendiri:
   - tunai + kurs isian sendiri (money changer) → kurs itu
   - tanggal hari ini → kurs live saat dicatat (jam tercatat)
   - tanggal yang sudah lewat → kurs harian tanggal itu
   - tanggal yang belum tiba → perkiraan dari kurs sekarang, dikunci ulang saat harinya tiba */
const expIdr = (e) => (e.cur === 'IDR' ? e.amount : e.rate ? e.amount * e.rate : idr(e.amount, e.cur));
const rateKeyOf = (e) => [e.amount, e.cur, e.date, e.pay || 'card'].join('|');
let fixingRates = false;
async function fixExpenseRates(t) {
  if (fixingRates || !navigator.onLine) return;
  fixingRates = true;
  let changed = false;
  try {
    const today = todayStr();
    for (const e of t.expenses) {
      if (e.cur === 'IDR') { if (e.rate) { e.rate = e.rateAt = e.rateSrc = e.rateKey = null; changed = true; } continue; }
      const key = rateKeyOf(e);
      if (e.rateKey === key && !(e.rateSrc === 'est' && e.date <= today)) continue;
      let r = null;
      if (e.pay === 'cash' && state.manual[e.cur]) r = { rate: state.manual[e.cur], rateAt: Math.floor(Date.now() / 1000), rateSrc: 'manual' };
      else if (e.date && e.date < today) { const v = await histRate(e.cur, e.date); if (v) r = { rate: v, rateAt: null, rateSrc: 'day' }; }
      else {
        await refreshRates(false, e.cur);
        const a = state.rates[e.cur];
        if (a) r = { rate: a.idr, rateAt: a.at, rateSrc: e.date && e.date > today ? 'est' : a.live ? 'live' : 'daily' };
      }
      if (r) { Object.assign(e, r, { rateKey: key }); changed = true; }
    }
  } finally { fixingRates = false; }
  if (changed) { save(); render(); }
}
function expRateLine(e) {
  if (e.cur === 'IDR' || !e.rate) return '';
  const k = `Kurs Rp${fmtRate(e.rate)}`;
  if (e.rateSrc === 'manual') return `${k} · money changer (tunai)`;
  if (e.rateSrc === 'day') return `${k} · kurs harian ${shortDate(e.date)}`;
  if (e.rateSrc === 'est') return `${k} · perkiraan, dikunci saat ${shortDate(e.date)}`;
  return `${k} · ${e.rateSrc === 'live' ? 'live' : 'harian'} ${rateAge(e.rateAt)}`;
}
function rateLine(cur) {
  const r = rateInfo(cur);
  const st = rateStatus[cur];
  const a = state.rates[cur];
  if (r.source === 'auto') return `${a && a.live ? 'Kurs live' : 'Kurs harian'} ${rateAge(r.at)} · ${(a && a.src) || 'ExchangeRate-API'}${st === 'loading' ? ' · memperbarui…' : ''}`;
  if (r.source === 'manual') return state.useManual[cur] ? 'Kurs isian sendiri' : 'Kurs isian sendiri (kurs otomatis belum bisa diambil)';
  if (st === 'loading') return 'Mengambil kurs terbaru…';
  return 'Kurs otomatis belum tersedia. Butuh internet, atau isi kurs sendiri di Budget.';
}

function ratingAvg(x) {

function mapsRoute(stops) {

/* Tab Rencana menampilkan satu hari: pilih tanggal di strip atas, geser kiri/kanan, atau tombol ‹ ›. "Semua" = semua hari. */
function planDayOf(t) {
  const days = dayRange(t.start, t.end);
  const v = (state.planDay || {})[t.id];
  if (v === 'all' || days.includes(v)) return v;
  if (!days.length) return 'all';
  const today = todayStr();
  return days.includes(today) ? today : days[0];
}
function setPlanDay(t, d, dir) {
  state.planDay = Object.assign({}, state.planDay, { [t.id]: d });

  const pane = $('#dayPane');
  if (pane && dir && !matchMedia('(prefers-reduced-motion: reduce)').matches) pane.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
  window.scrollTo({ top: 0 });

function stepPlanDay(dir) {
  const t = trip(); if (!t) return;
  const days = dayRange(t.start, t.end), cur = planDayOf(t);
  if (cur === 'all') return;
  const n = days[days.indexOf(cur) + dir];
  if (n) setPlanDay(t, n, dir);

let swipe = null;
document.addEventListener('touchstart', (e) => {
  if (state.tab !== 'plan' || !trip() || e.touches.length !== 1 || sheetRoot.innerHTML || pickerRoot.innerHTML) { swipe = null; return; }
  if (e.target.closest('.strip,.chips,input,textarea,select,.ratetbl')) { swipe = null; return; }
  swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY, at: Date.now() };
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!swipe) return;
  const dx = e.changedTouches[0].clientX - swipe.x, dy = e.changedTouches[0].clientY - swipe.y;
  const ok = Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8 && Date.now() - swipe.at < 700;

// Booking penginapan yang sama dengan aktivitas penginapan (nama & tanggal sama) cukup tampil sekali lewat aktivitasnya.
const stayBookingFor = (t, x) => t.bookings.find((b) => isStayBooking(b) && b.date === x.day && b.dateEnd === x.dayEnd && fold(b.title) === fold(x.title));
const bookingHasStayItem = (t, b) => t.items.some((x) => isStayItem(x) && x.day === b.date && x.dayEnd === b.dateEnd && fold(x.title) === fold(b.title));
// Booking yang terhubung ke aktivitas (dibuat otomatis dari Rencana) tampil lewat kartu aktivitasnya saja.
const linkedBooking = (t, x) => (x.bookingId && t.bookings.find((b) => b.id === x.bookingId)) || (isStayItem(x) ? stayBookingFor(t, x) : null) || null;
const bookingHidden = (t, b) => (b.itemId && t.items.some((x) => x.id === b.itemId)) || (isStayBooking(b) && bookingHasStayItem(t, b));
function syncBookingFromItem(t, it, code) {
  let b = linkedBooking(t, it);
  if (!b) { b = { id: uid(), status: 'todo', code: '', link: '', note: '' }; t.bookings.push(b); }
  Object.assign(b, { itemId: it.id, title: it.title, kind: ITEM_BOOK[it.type] || 'other', date: it.day, time: it.time || '', price: it.cost || 0, cur: it.cur,
    dateEnd: it.dayEnd || null, timeOut: it.timeOut || null, nights: it.nights || null, perNight: it.perNight || null, priceMode: it.priceMode || null });

}
// Lepas booking dari aktivitas; booking yang masih kosong (belum dipesan, tanpa kode) ikut dihapus.
function unlinkBooking(t, it) {
  const b = it.bookingId && t.bookings.find((x) => x.id === it.bookingId);
  it.bookingId = null;
  if (!b) return;
  if (b.status === 'todo' && !b.code) t.bookings = t.bookings.filter((x) => x.id !== b.id); else b.itemId = null;
}
/* Pengeluaran ↔ Rencana ↔ Booking. Pengeluaran menyimpan itemId (aktivitas) atau bookingId (booking tanpa aktivitas);
   jumlah, mata uang, dan tanggal menginap disamakan ke semua yang terhubung. */
const ITEM_EXP = { food: 'food', transport: 'transport', flight: 'transport', stay: 'stay', activity: 'activity', photo: 'activity', other: 'other' };
const EXP_ITEM = { food: 'food', transport: 'transport', stay: 'stay', activity: 'activity', shopping: 'other', other: 'other' };
const EXP_AUTO = ['food', 'transport', 'stay', 'activity'];
const itemExpense = (t, x) => t.expenses.find((e) => e.itemId === x.id) || null;
const bookingExpense = (t, b) => t.expenses.find((e) => e.bookingId === b.id || (b.itemId && e.itemId === b.itemId)) || null;
const markPaid = (b) => { if (b && b.status === 'todo') b.status = 'booked'; };
function upsertExpense(t, link, src) {
  let e = link.itemId ? t.expenses.find((x) => x.itemId === link.itemId) : t.expenses.find((x) => x.bookingId === link.bookingId);
  if (!e) { e = { id: uid(), title: src.title, category: src.category, date: src.date || todayStr() }; t.expenses.push(e); }
  Object.assign(e, { itemId: link.itemId || null, bookingId: link.bookingId || null, amount: src.amount, cur: src.cur });
  if (src.category === 'stay' && src.dateEnd) Object.assign(e, { category: 'stay', date: src.date, dateEnd: src.dateEnd, nights: src.nights, perNight: src.perNight, priceMode: src.priceMode });
  return e;
}
const expFromItem = (x) => ({ title: x.title, amount: x.cost, cur: x.cur, category: ITEM_EXP[x.type] || 'other', date: x.day, dateEnd: x.dayEnd, nights: x.nights, perNight: x.perNight, priceMode: x.priceMode });
const expFromBooking = (b) => ({ title: b.title, amount: b.price, cur: b.cur, category: b.kind === 'stay' ? 'stay' : b.kind === 'food' ? 'food' : b.kind === 'ticket' ? 'activity' : b.kind === 'other' ? 'other' : 'transport',
  date: b.date, dateEnd: b.dateEnd, nights: b.nights, perNight: b.perNight, priceMode: b.priceMode });
// Pengeluaran diubah → biaya aktivitas/booking ikut
function applyExpense(t, e) {
  const x = e.itemId && t.items.find((i) => i.id === e.itemId);
  if (x) {
    Object.assign(x, { cost: e.amount, cur: e.cur });
    if (x.type === 'stay' && e.category === 'stay' && e.dateEnd) {
      const moved = x.day !== e.date;
      Object.assign(x, { day: e.date, dayEnd: e.dateEnd, nights: e.nights, perNight: e.perNight, priceMode: e.priceMode });
      if (moved) x.order = insertOrder(t, x.day, x.time, x.id);
    }
    if (linkedBooking(t, x)) markPaid(syncBookingFromItem(t, x));
    return;
  }
  const b = e.bookingId && t.bookings.find((i) => i.id === e.bookingId);

// Pengeluaran baru tanpa pasangan → buat aktivitas di Rencana (dan booking bila jenisnya biasa dipesan)
const unlinkedExpenses = (t) => t.expenses.filter((e) => EXP_AUTO.includes(e.category)
  && !(e.itemId && t.items.some((x) => x.id === e.itemId)) && !(e.bookingId && t.bookings.some((b) => b.id === e.bookingId)));

  const days = dayRange(t.start, t.end);
  const day = days.includes(e.date) ? e.date : t.start;
  let x = t.items.find((i) => i.day === day && fold(i.title) === fold(e.title));
  if (!x) {
    x = { id: uid(), done: false, title: e.title, type: EXP_ITEM[e.category] || 'other', day, time: '', location: '', note: '', cost: e.amount, cur: e.cur, g: null,
      dayEnd: null, timeOut: null, nights: null, perNight: null, priceMode: null, at: null };
    if (x.type === 'stay' && e.dateEnd) Object.assign(x, { day: e.date, dayEnd: e.dateEnd, time: STAY_IN, timeOut: STAY_OUT, nights: e.nights, perNight: e.perNight, priceMode: e.priceMode });
    x.order = insertOrder(t, x.day, x.time);
    t.items.push(x);

}

function renderDay(t, d, i) {

/* ---------- Jelajahi: destinasi per kota di negara tujuan ----------
 * Kota diambil dari rute trip (dan daftar pilihan untuk negara itu).
 * "Pilihan" = daftar kurasi (Phu Quoc, Hanoi). "Wisata"/"Kuliner" = diambil dari Google, disimpan 30 hari.

const catalogCitiesFor = (country) => Object.values(CATALOG).filter((c) => fold(c.country) === fold(country)).map((c) => c.label);

  const country = t.country || t.place || '';
  const cat = city ? findCatalog(city, country) : null;
  const modes = (cat ? [['pilihan', 'Pilihan']] : []).concat([['wisata', 'Wisata'], ['kuliner', 'Kuliner']]);
  const mode = modes.some((m) => m[0] === state.exploreMode) ? state.exploreMode : modes[0][0];
  return { cities, city, country, cat, modes, mode, key: exploreKey(mode, city, country) };
}
function renderExplore(t) {
  const { cities, city, country, cat, modes, mode, key } = exploreState(t);

  if (!city) {

    }).join('');

      : items.map((g) => exploreRow({ title: g.name, type: mode === 'kuliner' ? 'food' : 'activity', note: g.address, g, maps: g.uri || mapsSearch(g.name + ', ' + city), rl: reviewLinks({ place: `${city} ${country}` }, { title: g.name }),
          save: savedNames.has(fold(g.name)) ? null : `data-a="saveExplore" data-key="${esc(key)}" data-i="${cache.items.indexOf(g)}"` })).join('')
        || '<div class="li"><div class="main muted">Tidak ada yang cocok.</div></div>';

    <div class="card" style="margin-top:10px">${body || '<div class="li"><div class="main muted">Tidak ada yang cocok.</div></div>'}</div>`;

function exploreRow({ title, type, note, g, maps, rl, save }) {

    <div class="row" style="gap:6px"><span class="pill t-${type}">${esc(label(ITEM_TYPES, type))}</span>${g && g.rating ? `<span class="star num">${gRating(g)}</span>` : ''}</div>

async function fetchExplore(t) {
  if (!placesEnabled() || !navigator.onLine) return;
  const { city, country, cat, mode, key } = exploreState(t);
  if (!city) return;
  if (mode === 'pilihan') { fetchCatalogRatings(cat[1]); return; }
  const cache = (state.gexplore || {})[key];
  if ((cache && Date.now() - cache.at < 30 * 86400000) || exploreLoading[key] === true) return;
  exploreLoading[key] = true;
  try {
    const q = `${mode === 'kuliner' ? 'restoran dan kuliner populer' : 'tempat wisata populer'} di ${city}, ${country}`;
    const items = await searchPlaces(q, 15);
    state.gexplore = state.gexplore || {};
    state.gexplore[key] = { at: Date.now(), items: items.sort((a, b) => (b.rating || 0) * Math.log10(10 + b.count) - (a.rating || 0) * Math.log10(10 + a.count)) };
    exploreLoading[key] = false;
    save(true);
  } catch (e) { exploreLoading[key] = 'fail'; console.warn(e); }
  if (state.tab === 'places') softRender();
}

/* Rating daftar pilihan diambil dari Google sekali, lalu disegarkan setelah 30 hari. */
const catG = (c) => (state.gcat || {})[fold(c.location)] || null;
let catQueue = false;
async function fetchCatalogRatings(cat) {
  if (catQueue || !cat || !placesEnabled() || !navigator.onLine) return;
  const todo = cat.items.filter((c) => { const g = catG(c); return !g || Date.now() - g.at > 30 * 86400000; });
  if (!todo.length) return;
  catQueue = true;
  state.gcat = state.gcat || {};
  try {
    for (const c of todo) {
      const res = await searchPlaces(withPlace(c.location, cat.place));
      state.gcat[fold(c.location)] = res[0] || { rating: null, count: 0, uri: '', at: Date.now() };
      save(true); if (state.tab === 'places') softRender();
    }
  } catch (e) { console.warn(e); }
  catQueue = false;
}
async function fillRatings(t) {
  const list = t.places.concat(t.items).filter((x) => noG(x) && x.type !== 'transport');
  if (!list.length) return;
  if (Date.now() < googleDownUntil) { toast('Kuota pencarian Google sedang habis. Coba lagi nanti.', null, null, 4000); return; }
  toast(`Mengambil rating ${list.length} tempat…`);
  let ok = 0;
  for (const x of list) {
    try {
      const q = withPlace(isUrl(x.location) || !x.location ? x.title : x.location, whereOf(t, x));
      const res = await searchPlaces(q);
      if (res[0]) { x.g = res[0]; ok++; }
    } catch (e) { toast('Gagal mengambil rating. Cek API key Google.'); break; }
  }
  save(); render(); toast(`${ok} tempat mendapat rating Google`);
}

function renderRateCard(t, withCalc) {
  const r = rateOf(t.cur);
  // Nominal contoh disesuaikan nilai mata uangnya: mulai dari yang setara ±Rp10.000
  const unit = r ? Math.pow(10, Math.max(0, Math.round(Math.log10(10000 / r)))) : 1;
  const quick = [1, 5, 10, 50, 100].map((n) => n * unit);
  return `<div class="card" style="padding:14px;margin-top:10px">
    <div class="row" style="justify-content:space-between">
      <div><div class="big" style="font-size:22px">1 ${esc(t.cur)} = ${r ? 'Rp' + fmtRate(r) : '—'}</div>
      <div class="muted" style="font-size:12.5px">${esc(rateLine(t.cur))}</div></div>
      <button class="btn ghost small" data-a="refreshRates">Perbarui</button>
    </div>
    ${withCalc ? `<div class="f2" style="margin-top:12px"><div class="f"><label for="cvLocal">${esc(t.cur)}</label><input id="cvLocal" type="text" inputmode="decimal" autocomplete="off" placeholder="100.000" data-conv="local" data-num="2"></div>
      <div class="f"><label for="cvIdr">IDR</label><input id="cvIdr" type="text" inputmode="decimal" autocomplete="off" placeholder="0" data-conv="idr" data-num="0"></div></div>` : ''}
    ${r && t.cur !== 'IDR' ? `<div class="ratetbl num">${quick.filter((n) => n >= 1).map((n) => `<span>${esc(money(n, t.cur))}</span><b>Rp${fmtN(n * r)}</b>`).join('')}</div>` : ''}
    <div class="muted" style="font-size:12px;margin-top:8px">Kurs tengah pasar live, diperbarui otomatis tiap 15 menit. Setiap pengeluaran memakai kurs pada hari/jam dicatat. Money changer dan kartu biasanya sedikit lebih mahal.</div>
  </div>`;
}

      const data = { name: v.name, country, countryCode: found ? found.code : '', place: country, start: v.start, end, cur: v.cur || 'VND' };
      if (isNew) {
        const nt = newTrip(data); state.trips.push(nt); state.activeTripId = nt.id; state.tab = 'plan';
        setTimeout(() => cityForm(nt, nt.start), 50); // langsung atur kota hari pertama

      }

}

/* ---------- penginapan: check-in → check-out ----------
 * Satu data penginapan menyimpan tanggal masuk & keluar. Di tab Rencana, hari check-out dan malam di antaranya
 * ditampilkan otomatis, jadi tidak perlu input per hari. Jam default: check-in 14:00, check-out 12:00.
 */
const STAY_IN = '14:00', STAY_OUT = '12:00';
const nightsOf = (a, b) => (a && b && b > a ? diffDays(a, b) : 0);
const shortDay = (s) => { const d = parseD(s); return `${WD[d.getUTCDay()]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
function stayRangeLabel(a, b) {

  return `<span class="rangetxt"><span><small>Check-in</small>${shortDay(a)}</span><span class="arrow">→</span><span><small>Check-out</small>${b ? shortDay(b) : '…'}</span></span>
    ${nightsOf(a, b) ? `<b class="nights">${nightsOf(a, b)} malam</b>` : ''}`;
}
// Kolom tambahan penginapan untuk form aktivitas/booking/pengeluaran. `on` = syarat tampil (mis. 'type=stay').
function stayFields(on, x, fallbackDay) {
  const a = (x && x.stayIn) || fallbackDay || '', b = (x && x.stayOut) || (a ? addDays(a, 1) : '');
  return [
    { name: 'stay', type: 'stayrange', label: 'Tanggal menginap', inVal: a, outVal: b, when: on },
    { name: 'timeIn', label: 'Jam check-in', type: 'time', value: (x && x.timeIn) || STAY_IN, half: true, when: on },
    { name: 'timeOut', label: 'Jam check-out', type: 'time', value: (x && x.timeOut) || STAY_OUT, half: true, when: on },
  ];
}
const priceModeField = (on, x) => ({ name: 'priceMode', label: 'Harga yang diisi', type: 'select', value: (x && x.priceMode) || 'night', options: [['night', 'Per malam'], ['total', 'Total seluruh malam']], when: on });
function readStay(v) {
  const nights = nightsOf(v.stayIn, v.stayOut);
  return { stayIn: v.stayIn, stayOut: v.stayOut, nights, timeIn: v.timeIn || STAY_IN, timeOut: v.timeOut || STAY_OUT };
}
// Harga penginapan → total (disimpan) + per malam
function stayPrice(amount, mode, nights) {
  if (!amount || !nights) return { total: amount, perNight: amount };
  return mode === 'total' ? { total: amount, perNight: amount / nights } : { total: amount * nights, perNight: amount };
}
function stayCalcText(form, amountInput) {
  const pm = form && form.elements.priceMode;
  if (!pm || pm.closest('[data-when]')?.hidden) return null;
  const nights = nightsOf(form.elements.stayIn?.value, form.elements.stayOut?.value);
  const n = num(amountInput.value);
  const cur = form.querySelector(`[name="${amountInput.dataset.money}"]`)?.value || 'IDR';
  if (!nights) return 'Pilih tanggal check-in dan check-out dulu';
  if (!n) return `${nights} malam`;
  const { total, perNight } = stayPrice(n, pm.value, nights);
  const conv = cur !== 'IDR' && rateOf(cur) ? ` ≈ Rp${fmtN(idr(total, cur))}` : '';
  return pm.value === 'total'
    ? `${money(total, cur)} untuk ${nights} malam = ${money(perNight, cur)}/malam${conv}`
    : `${nights} malam × ${money(perNight, cur)} = ${money(total, cur)}${conv}`;
}

/* Kalender rentang: ketuk tanggal check-in, lalu check-out. */

/* ---------- pemilih kota: daftar bawaan per negara + pencarian Google + ketik bebas ---------- */
let cityPickerTrip = null, citySearchTimer = null, citySeq = 0, cityTarget = 'city';
const cityCache = new Map();
async function searchCities(query, country) {
  const c = findCountry(country);
  const key = fold(query + '|' + country);
  if (cityCache.has(key)) return cityCache.get(key);
  const maps = await loadMaps(); if (!maps) return [];
  const { Place } = await maps.importLibrary('places');
  const req = { textQuery: `${query}, ${c ? c.en : country}`, maxResultCount: 8, language: 'id', fields: ['id', 'displayName', 'formattedAddress'] };
  let places;
  try { ({ places } = await Place.searchByText(Object.assign({ includedType: 'locality' }, req))); }
  catch (e) { ({ places } = await Place.searchByText(req)); }
  const inCountry = (p) => !c || [c.name, c.en].some((n) => fold(p.formattedAddress || '').includes(fold(n)));
  const out = [...new Map(places.filter(inCountry).map((p) => [fold(p.displayName), { name: p.displayName, sub: p.formattedAddress }])).values()];
  cityCache.set(key, out);
  return out;
}
function cityRowsHtml(t, query) {
  const f = fold(query.trim());
  const base = citiesOf(t.country);
  const used = tripCities(t);
  const pool = [...new Set(used.concat(catalogCitiesFor(t.country), base))];
  const cur = fold($('#f-' + cityTarget) ? $('#f-' + cityTarget).value : '');
  const row = (name, sub) => `<button type="button" class="prow ${fold(name) === cur ? 'on' : ''}" data-a="cityChosen" data-v="${esc(name)}"><span>${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>${used.some((u) => fold(u) === fold(name)) ? '<b>di rute</b>' : ''}</button>`;
  let html = '';
  if (cur && !f) html += cityTarget === 'from'
    ? `<button type="button" class="prow" data-a="cityChosen" data-v=""><span>Tidak pindah kota<small>Seharian di kota yang sama</small></span></button>`
    : `<button type="button" class="prow" data-a="cityChosen" data-v=""><span>Kosongkan kota<small>Hari ini belum ditentukan</small></span></button>`;
  if (f) {
    const hits = pool.filter((n) => fold(n).includes(f));
    html += hits.map((n) => row(n)).join('');
    if (!pool.some((n) => fold(n) === f)) html += `<button type="button" class="prow" data-a="cityChosen" data-v="${esc(query.trim())}"><span>Pakai “${esc(query.trim())}”<small>Ketik bebas, tidak dari daftar</small></span></button>`;
    html += placesEnabled() ? '<div class="pletter">Dari Google</div><div id="cityGoogle"><div class="pempty">Mencari…</div></div>' : '';
    return html;
  }
  if (used.length) html += '<div class="pletter">Sudah di rute</div>' + used.map((n) => row(n)).join('');
  const rest = pool.filter((n) => !used.some((u) => fold(u) === fold(n))).sort((a, b) => a.localeCompare(b, 'id'));
  let letter = '';
  rest.forEach((n) => { const L = fold(n)[0].toUpperCase(); if (L !== letter) { letter = L; html += `<div class="pletter">${L}</div>`; } html += row(n); });
  if (!pool.length) html += `<div class="pempty">Belum ada daftar kota bawaan untuk ${esc(t.country || 'negara ini')}.<br>Ketik nama kota di kotak pencarian${placesEnabled() ? ', hasilnya dicari lewat Google' : ''}.</div>`;
  return html;
}

// Atur kota untuk satu tanggal, sekaligus bisa diterapkan ke tanggal-tanggal berikutnya.
function cityForm(t, day) {
  const days = dayRange(t.start, t.end);
  if (!days.length) return;
  if (!days.includes(day)) day = days[0];
  const from = days.indexOf(day);
  // default "sampai": hari terakhir yang masih kosong atau berkota sama, berurutan dari hari ini
  const cur = cityOf(t, day);
  let to = from;
  while (to + 1 < days.length && cityOf(t, days[to + 1]) === cur) to++;
  const suggestions = [...new Set(tripCities(t).concat(catalogCitiesFor(t.country), citiesOf(t.country)))];
  cityPickerTrip = t;
  openForm({
    title: `Kota untuk ${dayLabel(day)}`, submit: 'Simpan kota',
    fields: [
      { name: 'city', label: `Kota di ${t.country || 'negara tujuan'}`, type: 'citypick', value: cur },
      { name: 'until', label: 'Berlaku sampai', type: 'select', value: days[to],
        options: days.slice(from).map((d, i) => [d, `${i === 0 ? 'Hari ini saja' : 'Sampai'} · Hari ${from + i + 1}, ${dayLabel(d)}`]) },
      { name: 'from', label: `Pindah kota di ${dayLabel(day)}? Berangkat dari`, type: 'citypick', value: fromOf(t, day), empty: 'Tidak pindah kota' },
    ],
    onSubmit(v) {
      const clean = (s) => { s = (s || '').trim().replace(/\s+/g, ' '); return suggestions.find((x) => fold(x) === fold(s)) || s; };
      const city = clean(v.city), origin = clean(v.from);
      if (origin && !city) { toast('Pilih dulu kota tujuannya'); $('#f-city-btn').click(); return false; }
      const end = days.indexOf(v.until);
      t.days = Object.assign({}, t.days);
      for (let i = from; i <= end; i++) { if (city) t.days[days[i]] = { city }; else delete t.days[days[i]]; }
      // kota asal hanya untuk hari pertama (hari perjalanan)
      if (city && origin && fold(origin) !== fold(city)) t.days[day] = { city, from: origin };
      if (city) { state.placeCity = city; toast(t.days[day].from ? `${origin} → ${city}` : `${city}: ${end - from + 1} hari`); }
    },
  });
}

        if (!s.nights) { toast('Pilih tanggal check-in dan check-out'); $('#f-stay-btn').click(); return false; }
        const p = stayPrice(data.cost, v.priceMode, s.nights);
        Object.assign(data, { day: s.stayIn, dayEnd: s.stayOut, time: s.timeIn, timeOut: s.timeOut, nights: s.nights, priceMode: v.priceMode, cost: p.total, perNight: p.perNight });
      }
      let x = it;
      if (isNew) t.items.push(x = Object.assign({ id: uid(), done: false }, data, { order: insertOrder(t, data.day, data.time) }));
      else { const moved = it.day !== data.day; Object.assign(it, data); if (moved) it.order = insertOrder(t, data.day, data.time, it.id); }
      // tampilan per hari: pindah ke hari aktivitas yang baru disimpan
      if (planDayOf(t) !== 'all' && dayRange(t.start, t.end).includes(x.day)) state.planDay = Object.assign({}, state.planDay, { [t.id]: x.day });
      if (v.book === 'yes') { const b = syncBookingFromItem(t, x, v.bookCode || ''); if (isNew) toast(`Tercatat juga di Booking: ${label(BOOK_KINDS, b.kind)}`); }
      else unlinkBooking(t, x);
      if (v.paid === 'yes') { upsertExpense(t, { itemId: x.id }, expFromItem(x)); markPaid(linkedBooking(t, x)); }
      else { const ex = itemExpense(t, x); if (ex) t.expenses = t.expenses.filter((i) => i !== ex); }
    },
    onDelete: isNew ? null : () => {
      unlinkBooking(t, it);
      t.expenses.forEach((e) => { if (e.itemId === it.id) e.itemId = null; }); // uangnya tetap tercatat keluar
      t.items = t.items.filter((x) => x.id !== it.id);
    },
  });
  syncAtField(t, it?.at || '');
  const bookSel = $('#f-book');
  if (isNew && bookSel) {
    bookSel.addEventListener('change', () => { bookSel.dataset.touched = '1'; });
    $('#f-type').addEventListener('change', (e) => { if (!bookSel.dataset.touched) { bookSel.value = BOOK_AUTO.includes(e.target.value) ? 'yes' : 'no'; applyWhen($('#sheetForm')); } });
  }
}
// Kolom "Di kota" hanya muncul jika hari yang dipilih adalah hari pindah kota.
function syncAtField(t, want) {
  const sel = $('#f-at'), dayEl = $('#f-day'); if (!sel || !dayEl) return;
  const d = dayEl.value, from = fromOf(t, d), city = cityOf(t, d);
  const keep = want !== undefined ? want : sel.value;
  const box = sel.closest('.f');
  if (!from || !city) { sel.innerHTML = '<option value=""></option>'; box.style.display = 'none'; return; }
  box.style.display = '';
  sel.innerHTML = `<option value="${esc(from)}">${esc(from)} · sebelum/saat berangkat</option><option value="">${esc(city)} · setelah tiba</option>`;
  sel.value = keep && fold(keep) === fold(from) ? from : '';
}
// Posisi baru: sebelum aktivitas pertama yang jamnya lebih akhir, selain itu di paling bawah.
function insertOrder(t, day, time, exceptId) {
  const list = sortItems(t.items.filter((x) => x.day === day && x.id !== exceptId));
  if (!list.length) return 1;
  if (time) {
    const idx = list.findIndex((x) => x.time && x.time > time);
    if (idx === 0) return list[0].order - 1;
    if (idx > 0) return (list[idx - 1].order + list[idx].order) / 2;
  }
  return list[list.length - 1].order + 1;
}

    <div class="foot"><button class="btn ghost" data-a="closeSheet">Batal</button><button class="btn" data-a="doImport">Pulihkan</button></div>`);
  $('#importFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $('#importText').value = String(r.result || ''); }; r.readAsText(f);
  });

function doImport() {
  let data;
  try { data = JSON.parse($('#importText').value); } catch (e) { toast('Teks cadangan tidak terbaca'); return; }
  const incoming = data && data.trip ? [data.trip] : data && Array.isArray(data.trips) ? data.trips : null;
  if (!incoming || !incoming.length || !incoming.every((t) => t && Array.isArray(t.items))) { toast('Format cadangan tidak dikenali'); return; }
  let added = 0, skipped = 0;
  incoming.forEach((t) => {
    // trip yang masih ada di HP ini tidak diduplikasi
    if (state.trips.some((x) => x.id === t.id || (t.shareId && x.shareId === t.shareId))) { skipped++; return; }
    const nt = newTrip(Object.assign({}, t));
    delete nt.joining;
    // trip online: versi server (bisa lebih baru) dipakai; jika sudah tidak ada di server, isi file dipakai
    if (nt.shareId) { nt.joining = true; nt.restoring = true; }
    state.removed = (state.removed || []).filter((x) => x !== nt.id);
    state.trips.push(nt); state.activeTripId = nt.id; added++;
  });
  state.tab = added === 1 ? 'plan' : state.tab;
  if (added !== 1) state.activeTripId = null;
  closeSheet(); save(); render(); startSync();
  toast(added ? `${added} trip dipulihkan${skipped ? `, ${skipped} sudah ada` : ''}` : 'Semua trip di cadangan sudah ada di HP ini');
}
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('Disalin'); }
  catch (e) { if (el && el.select) { el.focus(); el.select(); toast('Tekan dan tahan untuk menyalin'); } else toast('Salin manual: ' + text); }
}

/* ---------- actions ---------- */
const find = (arr, id) => arr.find((x) => x.id === id);
/*
 * Hapus trip dari HP ini. Trip bersama hanya dilepas dari HP ini; HP teman tetap menyimpannya.
 * Bisa diurungkan beberapa detik lewat tombol di notifikasi.
 */
function removeTrip(id) {
  const idx = state.trips.findIndex((x) => x.id === id);
  if (idx < 0) return;
  const t = state.trips[idx];
  if (t.shareId) unsubscribe(t.shareId);
  state.trips.splice(idx, 1);
  state.removed = (state.removed || []).concat(id).slice(-50); // dihapus sengaja: tidak ditawarkan untuk dipulihkan
  if (state.activeTripId === id) state.activeTripId = null;
  save(true); render(); window.scrollTo(0, 0);
  cloudForget(id);
  toast(t.shareId && !state.account ? `"${t.name}" dihapus dari HP ini. HP teman tetap menyimpannya.` : `"${t.name}" dihapus`, 'Urungkan', () => {
    state.removed = (state.removed || []).filter((x) => x !== id);
    state.trips.splice(Math.min(idx, state.trips.length), 0, t);
    save(true); render(); if (t.shareId) startSync(); if (state.account) { state.cloudIdx = ''; scheduleCloud(); }
    toast('Trip dikembalikan');
  }, 6000);
}
function moveItem(t, id, dir) {
  const it = find(t.items, id); if (!it) return;
  const list = sortItems(t.items.filter((x) => x.day === it.day));
  const i = list.indexOf(it), j = i + dir;
  if (j < 0 || j >= list.length) return;
  list.forEach((x, k) => { x.order = k + 1; });
  [list[i].order, list[j].order] = [list[j].order, list[i].order];
}
const actions = {
  home() { state.activeTripId = null; save(); render(); window.scrollTo(0, 0); },
  open(d) { state.activeTripId = d.id; state.tab = 'plan'; save(); render(); window.scrollTo(0, 0); },
  tab(d) { state.tab = d.k; save(); render(); window.scrollTo(0, 0); },
  newTrip() { tripForm(null); },
  editTrip() { tripForm(trip()); },
  template() { templateForm(); },
  jump(d) {
    const t = trip(); const cur = planDayOf(t);
    const days = dayRange(t.start, t.end);
    setPlanDay(t, d.d, cur === 'all' || d.d === 'all' ? 0 : Math.sign(days.indexOf(d.d) - days.indexOf(cur)));
  },
  dayStep(d) { stepPlanDay(+d.k); },
  addItem(d) { const t = trip(); if (!dayRange(t.start, t.end).length) return toast('Atur tanggal trip dulu'); const p = planDayOf(t); itemForm(t, null, d.d || (p !== 'all' ? p : undefined)); },
  editItem(d) { const t = trip(); itemForm(t, find(t.items, d.id)); },
  toggleDone(d) { const it = find(trip().items, d.id); if (it) { it.done = !it.done; save(); render(); } },
  moveUp(d) { moveItem(trip(), d.id, -1); save(); render(); },
  moveDown(d) { moveItem(trip(), d.id, 1); save(); render(); },
  sortDay(d) {
    const t = trip();
    const list = sortItems(t.items.filter((x) => x.day === d.d));
    list.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')).forEach((x, k) => { x.order = k + 1; });
    save(); render(); toast('Diurutkan berdasarkan jam');
  },
  reviews(d) { const t = trip(); const x = find(t[d.kind], d.id); if (x) reviewSheet(t, d.kind, x); },
  placeCity(d) { state.placeCity = d.k; exploreQuery = ''; save(true); render(); },
  exploreMode(d) { state.exploreMode = d.k; save(true); render(); },
  saveExplore(d) {
    const cache = (state.gexplore || {})[d.key]; const g = cache && cache.items[+d.i]; if (!g) return;
    const kuliner = d.key.startsWith('kuliner');
    trip().places.push({ id: uid(), title: g.name, type: kuliner ? 'food' : 'activity', location: [g.name, g.address].filter(Boolean).join(', '), note: '', g });
    save(); render(); toast('Tersimpan di Tempat simpanan');
  },
  setCity(d) { const t = trip(); cityForm(t, d.d || t.start); },
  pickCountry() { openCountryPicker(); },
  pickCity(d) { cityTarget = d.t || 'city'; openCityPicker(); },
  pickRange() { openRangePicker(); },
  rangeDay(d) { pickRangeDay(d.d); },
  rangeApply() { applyRange(); },
  cityChosen(d) { chooseCity(d.v || ''); },
  countryChosen(d) { chooseCountry(d.code); },
  pickerClose() { closeCountryPicker(); },
  pickerJump(d) { const el = document.getElementById('pl-' + d.k); if (el) el.scrollIntoView({ block: 'start' }); },
  saveCatalog(d) {

    const g = catG(c);
    trip().places.push({ id: uid(), title: c.title, type: c.type, location: c.location, note: c.note, g: g && g.pid ? g : null });
    save(); render(); toast('Tersimpan di Tempat simpanan');
  },

  placeSearch() { runPlaceSearch(true); },
  placePick(d, el) {
    const box = $('#placeResults'); const g = box && box._results && box._results[+d.i]; if (!g) return;
    $('#f-gplace').value = JSON.stringify(g);

    box.innerHTML = placeChosen(g);
  },
  placeClear() { $('#f-gplace').value = ''; $('#placeResults').innerHTML = ''; },
  async placeRefresh(d) {
    const t = trip(); const x = find(t[d.kind], d.id); if (!x) return;
    try {
      placeCache.clear();
      const res = await searchPlaces(x.g && x.g.name ? withPlace(x.g.name, whereOf(t, x)) : withPlace(isUrl(x.location) || !x.location ? x.title : x.location, whereOf(t, x)));
      if (res[0]) { x.g = res[0]; save(); render(); reviewSheet(t, d.kind, x); toast('Rating diperbarui'); } else toast('Tempat tidak ditemukan di Google');
    } catch (e) { toast('Gagal mengambil rating'); }
  },
  share() { const t = trip(); if (t.shareId) shareSheet(t); else enableShare(t); },
  copyShare() { copyText($('#shareText').value, $('#shareText')); },
  nativeShare() { const t = trip(); navigator.share({ title: t.name, text: `Rencana trip ${t.name}`, url: shareUrl(t) }).catch(() => {}); },
  stopShare() { const t = trip(); unsubscribe(t.shareId); delete t.shareId; delete syncState[t.id]; save(true); render(); toast('Trip ini tidak lagi disinkron di HP ini'); },
  joinOpen() { joinSheet(); },
  doJoin() { joinTrip($('#joinCode').value); },
  refreshRates() { refreshRates(true); toast('Mengambil kurs terbaru…'); },
  install() {
    if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); }
    else openSheetHtml('Pasang di HP', installHelp());
  },
  addPlace() { placeForm(trip(), null); },
  addSocialPlace() { socialPlaceForm(trip()); },
  signIn() { googleSignIn(); },
  signOut() { googleSignOut(); },
  backupFile() { saveBackupFile(); },
  recoverTrip(d) {
    const m = missingFromSnaps().find((x) => x.t.id === d.id); if (!m) return;
    const t = migrateTrip(m.t);
    ['items', 'places', 'bookings', 'expenses', 'checklist'].forEach((c) => { if (!Array.isArray(t[c])) t[c] = []; });
    state.trips.push(t); save(); render(); startSync();

  },

  cycleStatus(d) {

  copy(d, el) { copyText(d.text, null); },
  addExpense() { expenseForm(trip(), null); },
  editExpense(d) { const t = trip(); expenseForm(t, find(t.expenses, d.id)); },
  linkExpenses() {
    const t = trip(); const list = unlinkedExpenses(t);
    list.forEach((e) => itemFromExpense(t, e));
    save(); render(); toast(`${list.length} pengeluaran terhubung ke Rencana`);
  },
  setBudget() { budgetForm(trip()); },
  addCheck() { checkForm(trip()); },
  toggleCheck(d) { const c = find(trip().checklist, d.id); if (c) { c.done = !c.done; save(); render(); } },
  delCheck(d) { const t = trip(); t.checklist = t.checklist.filter((x) => x.id !== d.id); save(); render(); },
  exportOpen() { exportOpen(trip()); },

  importOpen() { importOpen(); },
  doImport() { doImport(); },

};

// Tombol hapus butuh dua ketukan (dialog confirm() tidak tersedia di semua tampilan).
const armed = new WeakMap();
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (a === 'scrim') { if (e.target === el) closeSheet(); return; }
  if (a === 'pickerScrim') { if (e.target === el) closeCountryPicker(); return; }
  const link = e.target.closest('a');
  if (link && el.contains(link)) return; // tautan (Maps, situs) di dalam kartu tetap terbuka
  if (el.type === 'checkbox') { actions[a] && actions[a](el.dataset, el, e); return; }
  if ('confirm' in el.dataset && !armed.get(el)) {
    e.preventDefault();
    const orig = el.textContent; el.textContent = 'Ketuk lagi untuk hapus'; el.classList.add('armed'); armed.set(el, true);
    setTimeout(() => { if (el.isConnected) { el.textContent = orig; el.classList.remove('armed'); armed.delete(el); } }, 3000);
    return;
  }
  if (actions[a]) { e.preventDefault(); actions[a](el.dataset, el, e); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (pickerRoot.firstChild) closeCountryPicker(); else if (sheetRoot.firstChild) closeSheet(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
});
let notesTimer;
document.addEventListener('input', (e) => {
  const t = trip();
  if (e.target.matches('[data-notes]') && t) { t.notes = e.target.value; clearTimeout(notesTimer); notesTimer = setTimeout(save, 400); }
  if (e.target.id === 'f-country') { const c = countryCur(e.target.value); const sel = $('#f-cur'); if (c && sel) sel.value = c; }
  if (e.target.matches('[data-num]')) formatNumInput(e.target, e.inputType === 'insertText' && (e.data === '.' || e.data === ','));
  if (e.target.matches('[data-money]')) refreshMoneyHint(e.target);
  if (e.target.matches('[data-conv]') && t) {
    const v = num(e.target.value), r = rateOf(t.cur);
    if (!r) return;
    const noCents = curDigits(t.cur) === 0;
    if (e.target.dataset.conv === 'local') $('#cvIdr').value = fmtInput(Math.round(v * r), 0);
    else $('#cvLocal').value = fmtInput(v / r, noCents ? 0 : 2);
  }
  if (e.target.matches('[data-placeinput]') || (e.target.id === 'f-title' && $('#f-location') && !$('#f-location').value.trim())) {
    if (e.target.matches('[data-placeinput]')) { const h = $('#f-gplace'); if (h) h.value = ''; }
    clearTimeout(placeTimer); placeTimer = setTimeout(runPlaceSearch, 800);
  }
  if (e.target.matches('[data-explore]')) {
    exploreQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $('#exploreSearch'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* tipe search */ } }
  }
});

function handleHash() {
  const m = location.hash.match(/^#gabung-([a-z0-9]{16,})$/i);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  joinTrip(m[1]);
}
